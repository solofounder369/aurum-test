<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Aurum Live Test</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurum">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width app column (max 460px): header, scrolling screen, gold tab bar. A single committed black-and-gold look. */
:root{
  --ink:#0B0A08; --night:#100E0A; --surface:#16140F; --raised:#1C1912; --line:#221E16; --edge:#3A3222; --bronze:#5A4A26;
  --gold:#C9A24B; --gold-l:#E8C97A; --gold-p:#F5DFA0; --gold-d:#B8933A;
  --text:#F3EBDD; --muted:#A69C8A; --urgent:#E58B6B; --ok:#9CC79A;
  --glitter:linear-gradient(transparent,transparent);
  --metal-base:linear-gradient(115deg,#7E5A1C 0%,#C99A3A 16%,#F4D888 30%,#FFF3C8 37%,#E3B654 48%,#A27426 62%,#E9C46C 78%,#FBE6A6 88%,#B98B35 100%);
  --metal:var(--glitter),var(--metal-base);
  --glow:0 0 18px rgba(232,196,106,.32);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.label{font-size:11px;letter-spacing:2.4px;color:var(--muted);text-transform:uppercase;font-weight:500}
.disp{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;color:var(--gold-l);text-wrap:balance}
.gt{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column}
.btn{height:48px;border:0;border-radius:24px;background:var(--metal);color:var(--ink);font-weight:600;font-size:15px;padding:0 20px;box-shadow:var(--glow)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{height:36px;font-size:13px;border-radius:18px;padding:0 14px;box-shadow:none}
.ghost{height:44px;border:1px solid var(--bronze);border-radius:22px;background:transparent;color:var(--gold-l);padding:0 16px}
.ghost.sm{height:36px;border-radius:18px;font-size:13px;padding:0 12px}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--edge);background:transparent;color:var(--gold-l);font-size:13px;font-weight:500}
.chip.on{background:var(--metal);border-color:#F7E08F;color:var(--ink)}
.chip.urgent.on{background:var(--urgent);border-color:var(--urgent)}
.mono{width:46px;height:46px;border-radius:50%;background:var(--raised);border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:20px;color:var(--gold-l);flex:none;overflow:hidden}
.mono img{width:100%;height:100%;object-fit:cover}
.ring{padding:2px;border-radius:50%;background:var(--metal);flex:none}
.ring .mono{border:2px solid var(--ink)}
.field{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--edge);background:var(--surface);color:var(--text);padding:12px 14px;font:15px var(--body)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--gold);outline:none}
textarea.field{resize:vertical;min-height:80px;line-height:1.45}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card{border-radius:18px;padding:16px;background:var(--surface);border:1px solid var(--line)}
.card.gold{border-color:var(--bronze)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--night);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);flex:none}
.tabs button{background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;min-height:56px;position:relative}
.tabs button.on{color:#F7E08F;font-weight:600}
.tabs svg{width:22px;height:22px}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--night);border-bottom:1px solid var(--line);flex:none}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:none;color:var(--gold-l);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:9px 13px 7px;border-radius:18px;line-height:1.42;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.them{background:var(--surface);border:1px solid #2A251B;border-bottom-left-radius:4px;align-self:flex-start}
.bubble.me{background:var(--metal);color:var(--ink);border-bottom-right-radius:4px;align-self:flex-end;box-shadow:0 4px 14px rgba(201,162,75,.22)}
.bubble .meta{font-size:10px;opacity:.75;text-align:right;margin-top:3px;white-space:normal}
.bubble .who{font-size:11px;color:var(--gold-l);font-weight:600;margin-bottom:2px;white-space:normal}
.prio{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:8px;margin-bottom:4px;white-space:normal}
.prio.today{background:rgba(232,201,122,.18);color:var(--gold-l)}
.bubble.me .prio.today{background:rgba(11,10,8,.15);color:var(--ink)}
.prio.urgent{background:var(--urgent);color:var(--ink)}
.promise{align-self:center;width:min(320px,92%);border-radius:18px;border:1px solid var(--bronze);background:linear-gradient(145deg,#211B10,#0E0C08);padding:14px;text-align:center}
.seal{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--edge);color:var(--ink);font-family:var(--display);font-weight:700;font-size:20px}
.seal.on{background:var(--metal);box-shadow:var(--glow)}
.composer{display:flex;flex-direction:column;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--night);border-top:1px solid var(--line);flex:none}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:120px;border-radius:22px;border:1px solid var(--edge);background:var(--surface);color:var(--text);padding:11px 16px;font:14px var(--body);resize:none}
.composer textarea:focus{border-color:var(--gold);outline:none}
.send{width:44px;height:44px;border-radius:22px;border:0;background:var(--metal);color:var(--ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.mcard{border-radius:22px;padding:22px;aspect-ratio:1.586;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#241D10 0%,#0E0C08 55%,#2E2412 100%) padding-box,var(--metal) border-box;border:1.5px solid transparent;box-shadow:0 18px 50px rgba(232,196,106,.25)}
.tier{padding:5px 10px;border-radius:10px;background:var(--metal);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:1.5px}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt label{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--edge);color:var(--gold-l);font-size:13px;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt input:checked + span{color:var(--ink)}
.opt label:has(input:checked){background:var(--metal);border-color:#F7E08F}
.opt label:has(input:focus-visible){outline:2px solid var(--gold-l);outline-offset:2px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.badge-test{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-l);border:1px solid var(--bronze);border-radius:10px;padding:3px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0} :root{padding-top:env(safe-area-inset-top,0px)}</style>
<script>
/* Glitter finish: fine metallic flakes baked into every gold surface (static, no animation). */
(function(){try{
var T=128,R=2,c=document.createElement('canvas');c.width=c.height=T*R;var x=c.getContext('2d');
function speck(n,size,col){for(var i=0;i<n;i++){var px=Math.random()*T*R,py=Math.random()*T*R,sz=size*(0.6+Math.random()*0.8)*R/2;x.fillStyle=col[Math.floor(Math.random()*col.length)];x.fillRect(px,py,sz,sz);}}
speck(2600,1,['rgba(90,52,12,.30)','rgba(120,70,20,.25)']);            /* grain shadows */
speck(4200,1,['rgba(255,236,170,.55)','rgba(240,190,95,.5)','rgba(214,130,52,.4)','rgba(255,214,120,.5)']); /* fine gold and copper dust */
speck(380,1.6,['rgba(255,244,205,.85)','rgba(255,222,140,.8)','rgba(246,190,100,.75)']);          /* bright flakes */
speck(18,2.4,['rgba(255,250,232,.95)']);                                  /* light-catching flakes */
document.documentElement.style.setProperty('--glitter','url('+c.toDataURL()+') 0 0/'+T+'px '+T+'px');
}catch(e){}})();
</script>
</head>
<body>
<div class="app" id="app" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>
<noscript>Aurum needs JavaScript to run.</noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
